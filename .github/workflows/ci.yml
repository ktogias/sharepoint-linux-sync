name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate shell syntax
        run: |
          bash -n setup-fedora.sh
          bash -n bin/sharepoint-sync
          bash -n bin/sharepoint-sync-all
          bash -n bin/sharepoint-sync-auth
          bash -n bin/sharepoint-sync-doctor
          bash -n scripts/doctor.sh

      - name: Validate configuration example
        run: python3 scripts/validate-config.py config/projects.example.json

      - name: Run Python tests
        run: python3 -m unittest discover -s tests -v

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          foreach ($path in @('src/sharepoint-sync.ps1', 'src/sharepoint-sync-all.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path), [ref]$tokens, [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Error "$path has PowerShell parse errors"
              $errors | Format-List
            }
          }
          if ($failed) { exit 1 }
